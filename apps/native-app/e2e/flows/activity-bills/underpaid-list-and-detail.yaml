# web activity-bills.spec.ts: "the bills list and detail page show an underpaid bill when another device changed the total while the payment was in flight".
appId: ${APP_ID}
tags: [activity-bills]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow: ../../subflows/begin-coffee-payment.yaml
- runFlow:
    file: ../../subflows/e2e-action.yaml
    env:
      ACTION: simulateBillModifiedDuringPayment
      QUERY: billId=${output.billId}&mode=add
- runFlow: ../../subflows/reopen-payment.yaml
- runFlow: ../../subflows/mark-cash-paid.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/bills
      TEXT: ${output.t["activity.title"]}
- assertVisible: ${output.t["bill.status.open"]}
- assertVisible: ${output.t["billHistory.underpaid"]}
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/bills/${output.billId}
      TEXT: ${output.t["billDetail.title"]}
- assertVisible: ${output.t["paymentDetail.bill.coverage.underpaid.title"]}
