# web bill.spec.ts: "discards a resumed cart from the bill page".
appId: ${APP_ID}
tags: [bill]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Coffee
      PRICE: "5"
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
- runFlow: ../../subflows/start-new-bill.yaml
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("bill.brick.add.aria", { name: "Coffee" })}'
# The lazily created bill is numbered once it exists.
- extendedWaitUntil:
    visible: '${output.tv("bill.list.label", { number: "\\d+" })}'
    timeout: 10000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
- extendedWaitUntil:
    visible:
      id: no-table-tile
    timeout: 10000
# Resume the saved cart.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("bill.list.label", { number: "\\d+" })}'
- extendedWaitUntil:
    visible: '${output.tv("bill.itemsCount", { value: 1 })}'
    timeout: 10000
# Discard it; it no longer appears among the saved carts.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["bill.discard"]}
- tapOn: ${output.t["bill.discard.confirm.confirm"]}
- extendedWaitUntil:
    visible: ${output.t["home.pos.noTable.empty"]}
    timeout: 10000
