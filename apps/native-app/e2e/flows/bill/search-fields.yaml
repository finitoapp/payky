# web bill.spec.ts: "search matches internal name, SKU and scan code".
appId: ${APP_ID}
tags: [bill]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Coffee
      PRICE: "5"
      INTERNAL_NAME: Espresso Blend
      SKU: COF-001
      SCAN_CODE: "8594001234567"
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Tea
      PRICE: "3"
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
- runFlow: ../../subflows/start-new-bill.yaml
# By internal name, SKU, scan code, and still by the public name. Staff see
# the internal name, so the brick carries it.
- evalScript: '${output.queries = ["Espresso", "COF-001", "8594001234567", "Coffee"]; output.queryIndex = 0}'
- repeat:
    times: 4
    commands:
      - runFlow:
          file: ../../subflows/fill-input.yaml
          env:
            LABEL: ${output.t["bill.search"]}
            VALUE: ${output.queries[output.queryIndex]}
      - runFlow:
          file: ../../subflows/assert-label.yaml
          env:
            LABEL: '${output.tv("bill.brick.add.aria", { name: "Espresso Blend" })}'
      - runFlow:
          file: ../../subflows/assert-label.yaml
          env:
            LABEL: '${output.tv("bill.brick.add.aria", { name: "Tea" })}'
            HIDDEN: "true"
      - evalScript: ${output.queryIndex = output.queryIndex + 1}
