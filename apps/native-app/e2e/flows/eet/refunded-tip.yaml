# web eet.spec.ts: "a refunded tip reaches EET only while tips belong to the
# business". What reaches EET is read off the mock; native shows no EET
# reversal card (native-e2e.md 3.3), which this test does not check anyway.
appId: ${APP_ID}
tags: [eet]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: fiatCurrency=CZK
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/reset
- runFlow: ../../subflows/enable-eet.yaml
# A tip that belongs to the business is reversed.
- runFlow: ../../subflows/eet-pay-with-tip.yaml
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=6.49
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/${output.paymentId}
      TEXT: ${output.t["paymentDetail.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- extendedWaitUntil:
    visible: '${output.tv("refund.dialog.tipHint", { amount: "CZK.0.49" })}'
    timeout: 10000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["refund.dialog.cancel"]}
- extendedWaitUntil:
    notVisible: ${output.re(output.t["refund.dialog.description"])}
    timeout: 10000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.re(output.t["paymentDetail.refunds.tipAction"].split("{amount}")[0])}.+'
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.0.49" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.tipCreated"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=6.49,-0.49
- assertVisible: '${output.re(output.t["paymentDetail.refunds.tip"])} · .*'
- assertNotVisible: '${output.re(output.t["paymentDetail.refunds.tipAction"].split("{amount}")[0])}.+'
# A tip that belongs to employees is not reversed.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/eet
      TEXT: ${output.t["settings.eet.title"]}
- scrollUntilVisible:
    element: ${output.re(output.t["settings.eet.tip.employees.title"])}
- tapOn: ${output.re(output.t["settings.eet.tip.employees.title"])}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.eet.tip.employees.title"]}
      BY_TEXT: "true"
- runFlow: ../../subflows/eet-pay-with-tip.yaml
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=6.49,-0.49,6.00
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/${output.paymentId}
      TEXT: ${output.t["paymentDetail.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.re(output.t["paymentDetail.refunds.tipAction"].split("{amount}")[0])}.+'
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.0.49" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.tipCreated"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- tapOn: ${output.t["refund.dialog.method.outside"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.+" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.created"]}
    timeout: 15000
# Only the goods are reversed: the tip refund never reached EET.
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=6.49,-0.49,6.00,-6.00
