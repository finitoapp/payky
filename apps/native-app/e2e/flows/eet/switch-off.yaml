# web eet.spec.ts: "EET can be switched off again". The settings list says
# so (web checks the switch, which Maestro's web driver cannot read).
appId: ${APP_ID}
tags: [eet]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: fiatCurrency=CZK
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/reset
- runFlow: ../../subflows/enable-eet.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/eet
      TEXT: ${output.t["settings.eet.title"]}
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["settings.eet.enabled.label"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.eet.enabled.label"]}
      CHECKED: "false"
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings
      TEXT: ${output.t["settings.title"]}
- scrollUntilVisible:
    element: ${output.t["settings.eet.title"]}
- extendedWaitUntil:
    visible: ${output.t["settings.eet.nav.off"]}
    timeout: 15000
