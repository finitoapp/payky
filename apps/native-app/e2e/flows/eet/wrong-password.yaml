# web eet.spec.ts: "a wrong certificate password is refused".
appId: ${APP_ID}
tags: [eet]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: fiatCurrency=CZK
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/reset
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/eet
      TEXT: ${output.t["settings.eet.title"]}
- runFlow:
    file: ../../subflows/import-eet-certificate.yaml
    env:
      PASSWORD: not-the-password
- extendedWaitUntil:
    visible: ${output.re(output.t["settings.eet.certificate.error.wrongPassword"])}
    timeout: 15000
- assertVisible: ${output.re(output.t["settings.eet.certificate.none"])}
