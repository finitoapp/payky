# web keypad.spec.ts: "the keypad takes physical-keyboard input and Enter
# charges the amount on screen", with the same corrections tapped on the
# keypad and Pay charging what is on screen. keypad-physical-keyboard.yaml
# types them on keys.
appId: ${APP_ID}
tags: [home]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/enter-amount.yaml
    env:
      AMOUNT: "5.9"
- assertVisible: .*5.9
# Correct the last digit.
- runFlow:
    file: ../../subflows/enter-amount.yaml
    env:
      AMOUNT: "<7"
- assertVisible: .*5.7
- tapOn: ${output.t["home.pay"]}
- extendedWaitUntil:
    visible: ${output.re(output.t["paymentWait.method.iban"])}|${output.re(output.t["paymentTip.none"])}
    timeout: 15000
