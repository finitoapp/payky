# web home-mode-toggle.spec.ts: "disabling a home mode in settings hides the
# switch, falls back to the first enabled mode and never leaves none".
# Switch states are checked on Android only (assert-checked).
appId: ${APP_ID}
tags: [home]
---
- runFlow: ../../subflows/seed-onboarding.yaml
# The home screen remembers tables mode.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.pos"]}
- assertVisible:
    id: no-table-tile
# Both modes start enabled.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/home-screen
      TEXT: ${output.t["settings.homeScreen.title"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["nav.numpad"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["nav.pos"]}
# Disabling tables mode leaves the keypad without a switch.
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["nav.pos"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["nav.pos"]}
      CHECKED: "false"
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
- assertNotVisible:
    id: no-table-tile
- assertNotVisible: ${output.t["nav.pos"]}
- assertNotVisible: ${output.t["nav.numpad"]}
# Disabling the last mode is refused with the reason.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/home-screen
      TEXT: ${output.t["settings.homeScreen.title"]}
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["nav.numpad"]}
- assertVisible: ${output.re(output.t["settings.homeScreen.atLeastOneMode"])}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["nav.numpad"]}
# Re-enabling tables mode brings the remembered mode back.
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["nav.pos"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["nav.pos"]}
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["bill.table.dialog.none"]}
- assertVisible:
    id: no-table-tile
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.numpad"]}
