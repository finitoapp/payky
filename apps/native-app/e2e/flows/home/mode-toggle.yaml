# web home-mode-toggle.spec.ts: "toggling the home icon switches between
# numpad and tables, and the choice survives a reload".
appId: ${APP_ID}
tags: [home]
---
- runFlow: ../../subflows/seed-onboarding.yaml
# Starts in numpad mode.
- assertVisible: ${output.t["home.pay"]}
- assertNotVisible:
    id: no-table-tile
# Toggling switches to tables mode in place.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.pos"]}
- assertVisible:
    id: no-table-tile
- assertNotVisible: ${output.t["home.pay"]}
# Tables mode survives a reload.
- runFlow:
    file: ../../subflows/relaunch.yaml
    env:
      TEXT: ${output.t["bill.table.dialog.none"]}
- assertVisible:
    id: no-table-tile
# Toggling back switches to numpad mode.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.numpad"]}
- assertVisible: ${output.t["home.pay"]}
- assertNotVisible:
    id: no-table-tile
# Numpad mode survives a reload.
- runFlow:
    file: ../../subflows/relaunch.yaml
    env:
      TEXT: ${output.t["home.pay"]}
