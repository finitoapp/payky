# web payment-tip.spec.ts: "there is no confirm button until a custom tip is
# being entered". Its disabled state is checked on Android only.
appId: ${APP_ID}
tags: [payment-tip]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow: ../../subflows/to-tip-step.yaml
- assertNotVisible: ${output.t["paymentTip.continue"]}
# The custom tile reveals it, disabled until an amount is entered.
- tapOn: ${output.t["paymentTip.custom.label"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["paymentTip.continue"]}
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: ${output.re(output.t["paymentTip.continue"])}
          enabled: false
