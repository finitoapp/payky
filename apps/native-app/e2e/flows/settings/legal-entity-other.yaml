# web settings-legal-entity.spec.ts: 'choosing "Other" is distinct from never
# having configured a country'.
appId: ${APP_ID}
tags: [settings]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/legal-entity
      TEXT: ${output.t["settings.legalEntity.title"]}
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["settings.legalEntity.country.label"]}
- tapOn: ${output.t["country.other"]}
- extendedWaitUntil:
    visible: ${output.t["country.other"]}
    timeout: 10000
# After a restart it shows Other, not the placeholder.
- runFlow:
    file: ../../subflows/reopen.yaml
    env:
      ROUTE: settings/legal-entity
      TEXT: ${output.t["settings.legalEntity.title"]}
- assertVisible: ${output.t["country.other"]}
- assertNotVisible: ${output.t["settings.legalEntity.country.placeholder"]}
