# web settings-payment-accounts.spec.ts: "reorder payment methods and let the
# first available one be the default". Row order and the Default badge are
# read by position (above/below a method's name); disabled and switch states
# are checked on Android only.
appId: ${APP_ID}
tags: [settings]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/payment-accounts
      TEXT: ${output.t["settings.paymentAccounts.title"]}
# The seed's default, cash, leads the list.
- assertVisible:
    text: ${output.t["settings.paymentAccounts.method.cashRegister"]}
    above: ${output.t["settings.paymentAccounts.method.iban"]}
- assertVisible:
    text: ${output.t["settings.paymentAccounts.default"]}
    above: ${output.t["settings.paymentAccounts.method.iban"]}
# Move the bank transfer to the top: it becomes the default.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("settings.paymentAccounts.moveUp.aria", { name: output.t["settings.paymentAccounts.method.iban"] })}'
- extendedWaitUntil:
    visible:
      text: ${output.t["settings.paymentAccounts.method.iban"]}
      above: ${output.t["settings.paymentAccounts.method.cashRegister"]}
    timeout: 10000
- assertVisible:
    text: ${output.t["settings.paymentAccounts.default"]}
    above: ${output.t["settings.paymentAccounts.method.cashRegister"]}
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          text: '${output.re(output.tv("settings.paymentAccounts.moveUp.aria", { name: output.t["settings.paymentAccounts.method.iban"] }))}'
          enabled: false
# Turning it off hands the default to the next available method.
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["settings.fiatBankAccount.enabled.label"]}
- extendedWaitUntil:
    visible:
      text: ${output.t["settings.paymentAccounts.default"]}
      below: ${output.t["settings.paymentAccounts.method.iban"]}
    timeout: 10000
- assertNotVisible:
    text: ${output.t["settings.paymentAccounts.default"]}
    above: ${output.t["settings.paymentAccounts.method.cashRegister"]}
# The order and the disabled method survive a restart.
- runFlow:
    file: ../../subflows/relaunch.yaml
    env:
      TEXT: ${output.t["home.pay"]}
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/payment-accounts
      TEXT: ${output.t["settings.paymentAccounts.title"]}
- assertVisible:
    text: ${output.t["settings.paymentAccounts.method.iban"]}
    above: ${output.t["settings.paymentAccounts.method.cashRegister"]}
- assertVisible:
    text: ${output.t["settings.paymentAccounts.default"]}
    below: ${output.t["settings.paymentAccounts.method.iban"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.fiatBankAccount.enabled.label"]}
      CHECKED: "false"
