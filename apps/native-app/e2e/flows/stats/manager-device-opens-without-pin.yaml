# web stats.spec.ts: "a Manager device opens the statistics without the PIN".
appId: ${APP_ID}
tags: [stats]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/turn-on-access.yaml
    env:
      PRESET: ${output.t["access.preset.manager"]}
# The statistics open from the activity header (the app restarted, so the
# PIN session is gone).
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity
      TEXT: ${output.t["activity.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.stats"]}
# "Live" marks the statistics page itself: its title is also the header
# button's label, which stays mounted under it on Android.
- extendedWaitUntil:
    visible: ${output.t["stats.live"]}
    timeout: 15000
- assertNotVisible: '${output.tv("access.pin.why.route", { permission: output.t["access.permission.stats"] })}'
