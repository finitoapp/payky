# Runs one bridge action (src/e2e/e2e-actions.ts) and waits for its OK:
# runFlow with env ACTION and, optionally, QUERY ("spark=true&...").
appId: ${APP_ID}
---
- openLink: '${BASE_URL}e2e/${ACTION}?${typeof QUERY === "undefined" ? "" : QUERY}'
- extendedWaitUntil:
    visible: E2E OK ${ACTION}.*
    timeout: 30000
