# web's fillInlineField: replaces the inline-edit field LABEL's text with
# VALUE, saves with the Save button and waits for the "saved" toast. BUTTONS:
# "true" for a field that opens already editing (see tap-input).
appId: ${APP_ID}
---
- runFlow:
    file: fill-input.yaml
    env:
      LABEL: ${LABEL}
      VALUE: ${VALUE}
      PLACEHOLDER: '${typeof PLACEHOLDER === "undefined" ? "" : PLACEHOLDER}'
      BUTTONS: '${typeof BUTTONS === "undefined" ? "" : BUTTONS}'
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["inlineEdit.save"]}
- extendedWaitUntil:
    visible: ${output.re(output.t["inlineEdit.saved"])}
    timeout: 15000
