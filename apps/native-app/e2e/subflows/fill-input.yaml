# Replaces the text of the input named LABEL with VALUE and checks it holds
# exactly VALUE.
appId: ${APP_ID}
---
- runFlow:
    file: tap-input.yaml
    env:
      LABEL: ${LABEL}
      BUTTONS: '${typeof BUTTONS === "undefined" ? "" : BUTTONS}'
- runFlow:
    file: clear-input.yaml
    env:
      LABEL: ${LABEL}
      PLACEHOLDER: '${typeof PLACEHOLDER === "undefined" ? "" : PLACEHOLDER}'
- inputText: ${VALUE}
- assertVisible:
    id: ${output.re(LABEL)}
    text: ${output.re(VALUE)}
