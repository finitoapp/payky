# From the terminal home with access control on and no PIN session: the
# settings gear, then Items, which lands on the PIN screen for Settings. In-app, because
# on Android a link onto a locked route while the app runs lands home
# (native-e2e.md open questions).
appId: ${APP_ID}
---
- runFlow:
    file: open-settings-entry.yaml
    env:
      FROM_HOME: "true"
      TITLE: ${output.t["settings.items.title"]}
- extendedWaitUntil:
    visible: '${output.tv("access.pin.why.route", { permission: output.t["access.permission.settings"] })}'
    timeout: 15000
