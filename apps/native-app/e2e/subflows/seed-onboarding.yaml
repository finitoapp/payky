# web's `seededPage`: a fresh app, onboarded by the bridge (cash + IBAN, USD,
# English), on the terminal home. Optional env QUERY: "spark=true",
# "fiatCurrency=CZK".
appId: ${APP_ID}
env:
  QUERY: ""
---
- runFlow: start.yaml
- openLink: ${BASE_URL}e2e/seedOnboarding?${QUERY}
# On Android the onboarding screen under the bridge leaves for home as soon as
# the account is onboarded (web's seed waits for the same redirect); on web
# the bridge page stays.
- extendedWaitUntil:
    visible: E2E OK seedOnboarding|${output.t["home.pay"]}
    timeout: 30000
- runFlow:
    file: goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
