# Taps the input named LABEL (its field label or aria-label), which is also
# its testID: one `id:` on both platforms (on Android the label's own text
# would match a text selector too). It taps near the right end, so the cursor
# lands after the text, where eraseText (it deletes backwards) clears it all.
# An inline field already editing has Save and Discard drawn over that end:
# BUTTONS: "true" taps at 70% instead (short text still ends left of it).
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${typeof BUTTONS === "undefined" || BUTTONS !== "true"}
    commands:
      - tapOn:
          id: ${output.re(LABEL)}
          point: 95%,50%
- runFlow:
    when:
      true: ${typeof BUTTONS !== "undefined" && BUTTONS === "true"}
    commands:
      - tapOn:
          id: ${output.re(LABEL)}
          point: 70%,50%
