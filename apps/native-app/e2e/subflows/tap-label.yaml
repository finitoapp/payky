# Taps the control named LABEL by its accessibility label (icon-only and
# other kit Buttons): content-desc text on Android, but an id on web, where
# Maestro reads aria-label as an id rather than as text. Inputs: tap-input.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: Web
    commands:
      - tapOn:
          id: ${output.re(LABEL)}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: ${output.re(LABEL)}
