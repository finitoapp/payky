# web's typePin: PIN (any length) on the PIN pad on screen, then OK.
appId: ${APP_ID}
---
- evalScript: ${output.pinIndex = 0}
- repeat:
    times: ${PIN.length}
    commands:
      - runFlow:
          file: tap-label.yaml
          env:
            LABEL: ${PIN[output.pinIndex]}
      - evalScript: ${output.pinIndex = output.pinIndex + 1}
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["access.pin.submit"]}
