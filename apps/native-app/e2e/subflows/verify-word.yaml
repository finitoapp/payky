# Types into the backup check's field "Word N" when the dialog asks for slot N
# (env N): the word from output.phrase when MODE is "right", else a wrong one.
appId: ${APP_ID}
---
# The field's label is its aria-label: an `id:` on web, as tap-input taps it.
- runFlow:
    file: tap-input.yaml
    env:
      LABEL: Word ${N}
- eraseText
- inputText: '${MODE == "right" ? output.phrase.split(" ")[N - 1] : "zzz"}'
